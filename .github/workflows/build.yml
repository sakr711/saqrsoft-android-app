name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت أدوات النظام
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5

      - name: تثبيت Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: تحميل الخط العربي تلقائياً
        run: |
          mkdir -p data
          wget -q -O data/NotoNaskhArabic-Regular.ttf "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf" \
            || wget -q -O data/NotoNaskhArabic-Regular.ttf "https://raw.githubusercontent.com/jenskutilek/free-fonts/master/Noto/Noto%20Naskh%20Arabic/TTF/NotoNaskhArabic-Regular.ttf"

      - name: تخزين مؤقت لتسريع البناء القادم
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: بناء الـ APK
        run: |
          yes | buildozer -v android debug || true
          yes | buildozer -v android debug

      - name: رفع الـ APK كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: SaqrSoft-APK
          path: bin/*.apk
          if-no-files-found: error
