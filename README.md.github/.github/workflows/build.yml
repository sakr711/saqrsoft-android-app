name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت أدوات النظام الحيوية
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-extras ccache libstdc++6:i386 libgcc1:i386 zlib1g:i386 libncurses5:i386 libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev cmake autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 git curl unzip lzip make

      - name: تثبيت Cython و Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install cython==0.29.36 buildozer

      - name: تحميل الخط العربي تلقائياً
        run: |
          mkdir -p data
          wget -q -O data/NotoNaskhArabic-Regular.ttf "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf" \
            || wget -q -O data/NotoNaskhArabic-Regular.ttf "https://raw.githubusercontent.com/jenskutilek/free-fonts/master/Noto/Noto%20Naskh%20Arabic/TTF/NotoNaskhArabic-Regular.ttf"

      - name: بناء الـ APK
        run: |
          buildozer -v android debug

      - name: رفع الـ APK كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: SaqrSoft-APK
          path: bin/*.apk
          if-no-files-found: error
